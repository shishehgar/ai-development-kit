[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-development-kit"
version = "0.1.0"
description = "AI Development Kit and Studio engineering workspace"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
]

# Explicit package discovery for the AIDK monorepo.
[tool.setuptools.packages.find]
where = ["."]
include = ["aidk*", "studio*"]
exclude = ["tests*", "docs*", "examples*"]
namespaces = true

